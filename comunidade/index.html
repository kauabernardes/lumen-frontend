<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumen | Comunidades</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="/css/header.css" />
    <link rel="stylesheet" href="/css/posts.css" />
    <link rel="stylesheet" href="/css/loadingSkeleton.css" />
  </head>

  <body>
    <header class="topbar">
      <div class="brand-side">
        <img src="../img/LogoLumen2.svg" class="logo-img" alt="Lumen" />
      </div>

      <nav>
        <a href="/home.html">home</a>
        <a href="/comunidade/" class="active">comunidades</a>
        <a href="../agenda/agenda.html">agenda</a>
      </nav>

      <div class="divisao-header">
        <div class="notif">
          <i class="fa-regular fa-bell icon-bell"></i>
          <span class="badge" id="badgeNotif">0</span>

          <div class="dropdown" id="dropdownNotificacao">
            <div class="dropdown-header">Notificações</div>

            <div class="empty" id="emptyNotif">
              Você não possui notificações
            </div>

            <div class="item">
              <span class="dot"></span>
              <p>Alguém curtiu seu conteúdo</p>
            </div>
          </div>
        </div>
      </div>

      <div class="right">
        <div class="user-menu">
          <div class="user-trigger">
            <i class="fa-regular fa-circle-user avatar"></i>
            <span class="username">João A B</span>
          </div>

          <div class="user-dropdown" id="userDropdown">
            <div class="user-info">
              <i class="fa-regular fa-circle-user avatar"></i>
              <span>João A B</span>
            </div>

            <div class="user-item">
              <i class="fa-solid fa-gear"></i>
              <span>Configurações</span>
            </div>

            <div class="user-item" id="btnSair">
              <i class="fa-solid fa-right-from-bracket"></i>
              <span>Sair</span>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <main class="container">
      <div class="left" id="comunidades-container"></div>

      <div class="center" id="center">
        <div class="create-community glass-card">
          <div class="icon">
            <i class="fa-regular fa-pen-to-square"></i>
          </div>
          <a href="/comunidade/criar/">Nova comunidade</a>
        </div>

        <div class="timeline" id="timeline-posts"></div>
      </div>

      <div class="right">
        <div class="ad-card glass-card">
          <img id="adImage" src="../img/anuncio1.jpg" alt="Anúncio" />
          <div class="ad-content">
            <button id="adButton">Assistir Agora</button>
          </div>
        </div>
      </div>
    </main>

    <script src="../js/header.js"></script>
    <script src="../js/api/client.js"></script>
    <script src="../js/api/services/authService.js"></script>
    <script src="../js/api/services/communityService.js"></script>
    <script src="../js/api/services/postService.js"></script>

    <script src="./main.js"></script>
  </body>
</html>
